worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  # Allow large uploads through the API proxy
  client_max_body_size 100m;

  server {
    listen 3000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Same-origin API proxy: session cookies set by the API stay first-party
    # (cross-subdomain cookies are impossible on onrender.com, a public suffix).
    # The admin app is built with VITE_API_BASE_URL="" so it calls /api and
    # /auth on its own origin and nginx forwards them to the API service.
    location /api/ {
      resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
      set $api_upstream https://plane-api-ydsi.onrender.com;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host plane-api-ydsi.onrender.com;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
      proxy_redirect off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    location /auth/ {
      resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
      set $auth_upstream https://plane-api-ydsi.onrender.com;
      proxy_pass $auth_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host plane-api-ydsi.onrender.com;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
      proxy_redirect off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # The SPA router basename is "/god-mode/" (trailing slash); bare
    # "/god-mode" does not match and renders nothing, so redirect it.
    # Absolute https URL: behind Render's TLS edge $scheme is http and
    # $server_port is the container port, both wrong for the browser.
    location = /god-mode {
      return 301 https://$host/god-mode/;
    }

    location / {
      root   /usr/share/nginx/html;
      try_files $uri /god-mode/index.html;
    }
  }
}
